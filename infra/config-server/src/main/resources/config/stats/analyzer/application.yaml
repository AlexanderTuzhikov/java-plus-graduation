server:
  port: 0

spring:
  application:
    name: analyzer
  cloud:
    config:
      enabled: false
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/stats
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  kafka:
    analyzer:
      bootstrap-servers: localhost:9092
      consumers:
        user-action:
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: ru.practicum.ewm.kafka.serializer.UserActionDeserializer
          group-id: analyzer-user-group
          client-id: consumer-user-1
          properties:
            fetch.min.bytes: 1
            max.poll.records: 100
            enable.auto.commit: false
            fetch.max.wait.ms: 1000
            max.partition.fetch.bytes: 1048576
        event-similarity:
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: ru.practicum.ewm.kafka.serializer.EventSimilarityDeserializer
          group-id: analyzer-event-group
          client-id: consumer-event-1
          properties:
            fetch.min.bytes: 1
            max.poll.records: 100
            enable.auto.commit: false
            fetch.max.wait.ms: 1000
            max.partition.fetch.bytes: 1048576

kafka:
  topics:
    user-actions: stats.user-actions.v1
    events-similarity: stats.events-similarity.v1

grpc:
  server:
    port: 0

logging:
  level:
    ru.practicum: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always