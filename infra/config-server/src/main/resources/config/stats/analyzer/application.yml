server:
  port: 0

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/stats
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  kafka:
    analyzer:
      bootstrap-servers: localhost:9092
      consumers:
        user-action:
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: ru.practicum.ewm.serializer.UserActionDeserializer
          group-id: analyzer-user-group
          client-id: consumer-user-1
          properties:
            fetch.min.bytes: 1
            max.poll.records: 100
            enable.auto.commit: false
            fetch.max.wait.ms: 1000
            max.partition.fetch.bytes: 1048576
        event-similarity:
          topic: stats.events-similarity.v1
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: ru.practicum.ewm.serializer.EventSimilarityDeserializer
          group-id: analyzer-event-group
          client-id: consumer-event-1
          properties:
            fetch.min.bytes: 1
            max.poll.records: 100
            enable.auto.commit: false
            fetch.max.wait.ms: 1000
            max.partition.fetch.bytes: 1048576

kafka:
  topics:
    user-actions: stats.user-actions.v1
    events-similarity: stats.events-similarity.v1

grpc:
  server:
    port: 0

logging:
  level:
    ru.practicum: DEBUG